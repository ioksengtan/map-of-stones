<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>城市圍棋・多地圖原型</title>
<meta name="description" content="以真實或架空城市地圖取代棋盤，完整移植圍棋的氣、連塊、提子、禁入、打劫與數地規則，並可切換三國五十城／燕雲十六州（輿圖版／實測地圖版）等多套地圖。">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
  integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
  crossorigin="" />
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
  integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
  crossorigin=""></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --bg: #e6ded0;
    --bg-wash: #ded4bf;
    --surface: #f1ebdd;
    --surface-2: #d9cfb6;
    --ink: #2a2419;
    --ink-soft: #6b6250;
    --ink-faint: #948a72;
    --line: #a4966f;
    --line-soft: #c3b791;
    --accent: #9c2e22;
    --accent-2: #c24d34;
    --accent-ink: #fdf6ea;
    --stone-black-a: #4d463a;
    --stone-black-b: #14110c;
    --stone-black-edge: #050403;
    --stone-black-mark: #d8c9a3;
    --stone-white-a: #fdf8ec;
    --stone-white-b: #e7dcc0;
    --stone-white-edge: #2a2419;
    --stone-white-mark: #2a2419;
    --ok: #4c6b3f;
    --warn: #9c2e22;
    --shadow: rgba(30, 24, 12, 0.28);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161310; --bg-wash: #1c1814; --surface: #221d17; --surface-2: #2c261e;
      --ink: #ece2cc; --ink-soft: #b6a98d; --ink-faint: #7d735d; --line: #5c5240; --line-soft: #746850;
      --accent: #d9694f; --accent-2: #e8895f; --accent-ink: #1c1814;
      --stone-black-a: #33302a; --stone-black-b: #030201; --stone-black-edge: #6b6146; --stone-black-mark: #b8ac8c;
      --stone-white-a: #f3ecd9; --stone-white-b: #d8cba8; --stone-white-edge: #161310; --stone-white-mark: #161310;
      --ok: #7fa568; --warn: #e8895f; --shadow: rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% 40%, var(--bg) 55%, var(--bg-wash) 100%);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 1360px; margin: 0 auto; padding: 28px 20px 60px; }
  header.top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line-soft);
    padding-bottom: 18px; margin-bottom: 22px;
  }
  .title-cartouche {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 5px 4px;
    border-top: 2px solid var(--line);
    border-bottom: 2px solid var(--line);
  }
  .title-cartouche::before, .title-cartouche::after { content: "\25C6"; color: var(--accent-2); font-size: 11px; }
  h1 {
    font-family: "Noto Serif TC", serif;
    font-weight: 900;
    font-size: clamp(22px, 3.1vw, 30px);
    margin: 0; letter-spacing: 0.06em;
  }
  header.top p { margin: 6px 0 0; color: var(--ink-soft); font-size: 14px; max-width: 64ch; }
  .header-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .version-tag { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--ink-faint); white-space: nowrap; letter-spacing: 0.03em; }
  select.scenario-select {
    font-family: "Noto Sans TC", sans-serif; font-size: 13.5px; font-weight: 700;
    border-radius: 9px; padding: 9px 12px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); cursor: pointer;
  }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; box-shadow: 0 10px 28px -18px var(--shadow); }
  .map-card { padding: 18px 18px 10px; position: relative; }
  #boardMount { border-radius: 10px; overflow: hidden; }
  .board-svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .board-map { width: 100%; height: 560px; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--bg-wash); }
  .leaflet-tooltip.city-tip {
    font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 11.5px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line-soft);
    padding: 1px 5px; box-shadow: none;
  }

  .map-card .legend {
    display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-soft);
    padding: 12px 4px 4px; border-top: 1px solid var(--line-soft); margin-top: 12px;
  }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 14px; height: 14px; border-radius: 50%; flex: none; display: inline-block; }
  .swatch.empty { background: var(--surface-2); border: 2px solid var(--line); }
  .swatch.black { background: radial-gradient(circle at 35% 30%, var(--stone-black-a), var(--stone-black-b)); border: 1.3px solid var(--stone-black-edge); }
  .swatch.white { background: radial-gradient(circle at 35% 30%, var(--stone-white-a), var(--stone-white-b)); border: 1.3px solid var(--stone-white-edge); }
  .swatch.hub { background: transparent; border: 2.6px solid var(--line); }

  .edge { stroke: var(--line); stroke-width: 2; }
  .node-hit { cursor: pointer; }
  .node-hit.occupied { cursor: default; }
  .node-hit .hit-area { fill: transparent; }
  .node-ring { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.8; transition: stroke 0.15s ease, fill 0.15s ease; }
  .node-ring.hub { stroke-width: 2.6; }
  .node-hit:hover:not(.occupied) .node-ring { stroke: var(--accent-2); }
  .node-hit:hover:not(.occupied) .hover-preview { opacity: 0.35; }
  .hover-preview { opacity: 0; transition: opacity 0.12s ease; pointer-events: none; }
  .city-label {
    font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 12.5px; fill: var(--ink);
    paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px;
  }
  .lib-badge circle { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
  .lib-badge text {
    font-family: "JetBrains Mono", monospace; font-size: 9.5px; font-weight: 600; fill: var(--ink-soft);
    text-anchor: middle; dominant-baseline: central;
  }
  .stone-black { fill: url(#gradBlack); stroke: var(--stone-black-edge); stroke-width: 1.3; }
  .stone-white { fill: url(#gradWhite); stroke: var(--stone-white-edge); stroke-width: 1.3; }
  .last-move-mark.black { fill: var(--stone-black-mark); }
  .last-move-mark.white { fill: var(--stone-white-mark); }

  .map-paper-base { fill: var(--bg-wash); }
  .map-frame-outer { fill: none; stroke: var(--line); stroke-width: 3; }
  .map-frame-inner { fill: none; stroke: var(--line-soft); stroke-width: 1.2; }
  .frame-corner { fill: var(--line); opacity: 0.55; }
  .mountain-ridge { fill: none; stroke: var(--ink-faint); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; opacity: 0.5; }
  .peak { fill: var(--ink-faint); opacity: 0.32; }
  .wall-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 9 6; opacity: 0.4; }
  .region-label { font-family: "Noto Serif TC", serif; font-weight: 700; fill: var(--ink-faint); opacity: 0.55; letter-spacing: 0.3em; }
  .compass-mark { stroke: var(--ink-faint); stroke-width: 1.4; opacity: 0.5; }
  .compass-label { font-family: "Noto Serif TC", serif; font-weight: 700; fill: var(--ink-faint); opacity: 0.6; text-anchor: middle; }

  aside.hud { display: flex; flex-direction: column; gap: 14px; }
  .turn-panel { padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .turn-label { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; }
  .turn-value { display: flex; align-items: center; gap: 8px; font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 20px; margin-top: 2px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; flex: none; }
  .dot.black { background: radial-gradient(circle at 35% 30%, var(--stone-black-a), var(--stone-black-b)); border: 1px solid var(--stone-black-edge); }
  .dot.white { background: radial-gradient(circle at 35% 30%, var(--stone-white-a), var(--stone-white-b)); border: 1px solid var(--stone-white-edge); }

  .score-panel { padding: 14px 18px; display: flex; gap: 10px; }
  .score-tile { flex: 1; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; text-align: center; }
  .score-tile .side { font-size: 12px; color: var(--ink-soft); }
  .score-tile .count { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; margin-top: 2px; }

  .actions { padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
  button {
    font-family: "Noto Sans TC", sans-serif; font-size: 14px; font-weight: 700; border-radius: 9px;
    padding: 10px 14px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    cursor: pointer; transition: transform 0.08s ease, filter 0.15s ease;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { filter: brightness(1.08); }

  .log-panel { padding: 12px 16px 16px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .log-panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); margin: 4px 0 8px; font-family: "Noto Sans TC", sans-serif; font-weight: 700; }
  #log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
  #log li { font-size: 13px; line-height: 1.5; padding: 7px 10px; border-radius: 8px; background: var(--surface-2); color: var(--ink-soft); }
  #log li.event-capture { color: var(--ok); }
  #log li.event-illegal { color: var(--warn); }
  #log li:first-child { color: var(--ink); }

  .overlay { position: fixed; inset: 0; background: rgba(20, 16, 10, 0.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
  .overlay[hidden] { display: none; }
  .score-sheet { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 16px; padding: 26px 28px; max-width: 420px; width: 100%; box-shadow: 0 24px 60px -20px var(--shadow); }
  .score-sheet h2 { font-family: "Noto Serif TC", serif; font-size: 22px; margin: 0 0 4px; }
  .score-sheet .sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 18px; }
  table.tally { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  table.tally th, table.tally td { text-align: right; padding: 6px 4px; font-size: 14px; border-bottom: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; font-family: "JetBrains Mono", monospace; }
  table.tally th:first-child, table.tally td:first-child { text-align: left; font-family: "Noto Sans TC", sans-serif; font-weight: 700; }
  table.tally thead th { font-family: "Noto Sans TC", sans-serif; font-weight: 700; color: var(--ink-faint); font-size: 12px; border-bottom: 1px solid var(--line); }
  .verdict { font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 17px; text-align: center; padding: 10px 0 18px; color: var(--accent-2); }

  footer.foot { margin-top: 22px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-faint); text-align: center; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="title-cartouche"><h1 id="scenarioTitle">城市圍棋</h1></div>
      <p id="scenarioDesc"></p>
    </div>
    <div class="header-side">
      <select id="scenarioSelect" class="scenario-select">
        <option value="sanguo">三國・五十城</option>
        <option value="yanyun_old">燕雲十六州・輿圖版</option>
        <option value="yanyun_real">燕雲十六州・實測地圖版</option>
      </select>
      <span class="version-tag">map-of-stones · 多地圖原型</span>
    </div>
  </header>

  <main>
    <section class="card map-card">
      <div id="boardMount"></div>
      <div class="legend">
        <span class="item"><span class="swatch empty"></span>中立空城</span>
        <span class="item"><span class="swatch black"></span><span id="legendBlackLabel">黑棋</span></span>
        <span class="item"><span class="swatch white"></span><span id="legendWhiteLabel">白棋</span></span>
        <span class="item"><span class="swatch hub"></span><span id="legendHubLabel">樞紐城市</span></span>
        <span class="item" id="legendLastItem">右上角數字＝該連塊的氣數</span>
      </div>
    </section>

    <aside class="hud">
      <div class="card turn-panel">
        <div>
          <div class="turn-label">現在輪到</div>
          <div class="turn-value"><span id="turnDot" class="dot black"></span><span id="turnText">黑</span></div>
        </div>
      </div>

      <div class="card score-panel">
        <div class="score-tile">
          <div class="side" id="capBlackLabel">黑方提子</div>
          <div class="count" id="capBlack">0</div>
        </div>
        <div class="score-tile">
          <div class="side" id="capWhiteLabel">白方提子</div>
          <div class="count" id="capWhite">0</div>
        </div>
      </div>

      <div class="card actions">
        <button class="primary" id="btnScore">終局數地</button>
        <button id="btnReset">重新開始</button>
      </div>

      <div class="card log-panel">
        <h2>對局紀錄</h2>
        <ul id="log"></ul>
      </div>
    </aside>
  </main>

  <footer class="foot">城市節點取代交叉點・道路／關隘取代棋盤格線・二色對戰，陣營名稱僅作皮膚包裝</footer>
</div>

<div class="overlay" id="scoreOverlay" hidden>
  <div class="score-sheet">
    <h2>終局數地</h2>
    <div class="sub">地（連塊完全包圍的中立城市）＋ 提子數</div>
    <table class="tally">
      <thead><tr><th>陣營</th><th>地</th><th>提子</th><th>總分</th></tr></thead>
      <tbody>
        <tr><td id="rowBlackLabel">黑</td><td id="territoryBlack">0</td><td id="tallyCapBlack">0</td><td id="totalBlack">0</td></tr>
        <tr><td id="rowWhiteLabel">白</td><td id="territoryWhite">0</td><td id="tallyCapWhite">0</td><td id="totalWhite">0</td></tr>
      </tbody>
    </table>
    <div class="verdict" id="verdictText"></div>
    <button class="primary" id="btnCloseScore" style="width:100%">繼續對局</button>
  </div>
</div>

  // ---------------------------------------------------------------------
  // 圍棋引擎（與地圖無關的純邏輯）
  // ---------------------------------------------------------------------

  function createEngine(cities, edges) {
    var neighbors = {};
    cities.forEach(function (c) { neighbors[c.id] = []; });
    edges.forEach(function (e) {
      neighbors[e[0]].push(e[1]);
      neighbors[e[1]].push(e[0]);
    });
    var order = cities.map(function (c) { return c.id; });
    var cityById = {};
    cities.forEach(function (c) { cityById[c.id] = c; });

    var board = {};
    order.forEach(function (id) { board[id] = null; });
    var turn = "black";
    var captures = { black: 0, white: 0 };
    var snapshotHistory = [snapshotOf(board)];
    var lastMove = null;

    function snapshotOf(b) {
      return order.map(function (id) { return b[id] ? b[id][0] : "-"; }).join("");
    }
    function cloneBoard(b) {
      var out = {};
      order.forEach(function (id) { out[id] = b[id]; });
      return out;
    }
    function getGroup(b, startId) {
      var color = b[startId];
      var stones = new Set([startId]);
      var stack = [startId];
      while (stack.length) {
        var cur = stack.pop();
        neighbors[cur].forEach(function (n) {
          if (b[n] === color && !stones.has(n)) {
            stones.add(n);
            stack.push(n);
          }
        });
      }
      var liberties = new Set();
      stones.forEach(function (s) {
        neighbors[s].forEach(function (n) {
          if (b[n] === null) liberties.add(n);
        });
      });
      return { stones: stones, liberties: liberties };
    }
    function opponent(c) { return c === "black" ? "white" : "black"; }

    function attemptMove(id) {
      if (board[id] !== null) return { status: "occupied" };
      var color = turn;
      var trial = cloneBoard(board);
      trial[id] = color;

      var capturedIds = [];
      var seen = new Set();
      neighbors[id].forEach(function (n) {
        if (trial[n] === opponent(color) && !seen.has(n)) {
          var g = getGroup(trial, n);
          g.stones.forEach(function (s) { seen.add(s); });
          if (g.liberties.size === 0) {
            g.stones.forEach(function (s) { capturedIds.push(s); });
          }
        }
      });
      capturedIds.forEach(function (s) { trial[s] = null; });

      var ownGroup = getGroup(trial, id);
      if (ownGroup.liberties.size === 0) return { status: "suicide" };

      var candidateSnapshot = snapshotOf(trial);
      var koGuard = snapshotHistory[snapshotHistory.length - 2];
      if (koGuard !== undefined && candidateSnapshot === koGuard) return { status: "ko" };

      board = trial;
      snapshotHistory.push(candidateSnapshot);
      if (capturedIds.length) captures[color] += capturedIds.length;
      lastMove = { id: id, color: color };
      turn = opponent(color);
      return { status: "moved", color: color, capturedIds: capturedIds, liberties: ownGroup.liberties.size };
    }

    function computeTerritory() {
      var visited = new Set();
      var territory = { black: 0, white: 0 };
      order.forEach(function (id) {
        if (board[id] !== null || visited.has(id)) return;
        var region = new Set([id]);
        var stack = [id];
        var borders = new Set();
        visited.add(id);
        while (stack.length) {
          var cur = stack.pop();
          neighbors[cur].forEach(function (n) {
            if (board[n] === null) {
              if (!visited.has(n)) {
                visited.add(n);
                region.add(n);
                stack.push(n);
              }
            } else {
              borders.add(board[n]);
            }
          });
        }
        if (borders.size === 1) {
          var owner_ = borders.values().next().value;
          territory[owner_] += region.size;
        }
      });
      return territory;
    }

    return {
      order: order,
      cityById: cityById,
      getGroup: getGroup,
      attemptMove: attemptMove,
      computeTerritory: computeTerritory,
      getBoard: function () { return board; },
      getTurn: function () { return turn; },
      getCaptures: function () { return captures; },
      getLastMove: function () { return lastMove; }
    };
  }

      + '<rect class="map-frame-inner" x="26" y="26" width="' + (W - 52) + '" height="' + (H - 52) + '"/>'
      + '<rect class="frame-corner" x="9" y="9" width="10" height="10" transform="rotate(45 14 14)"/>'
      + '<rect class="frame-corner" x="' + (W - 19) + '" y="9" width="10" height="10" transform="rotate(45 ' + (W - 14) + ' 14)"/>'
      + '<rect class="frame-corner" x="9" y="' + (H - 19) + '" width="10" height="10" transform="rotate(45 14 ' + (H - 14) + ')"/>'
      + '<rect class="frame-corner" x="' + (W - 19) + '" y="' + (H - 19) + '" width="10" height="10" transform="rotate(45 ' + (W - 14) + ' ' + (H - 14) + ')"/>';
  }

      + '<rect x="0" y="0" width="' + W + '" height="' + H + '" filter="url(#paperGrain)"/>';
    if (decor === "yanyun") {
      return paper

        + '<path class="mountain-ridge" d="M 640 55 C 600 135, 660 195, 610 255 C 560 315, 600 375, 560 435 C 520 495, 560 555, 520 608"/>'

        + '<polygon class="peak" points="560,298 578,324 542,324"/>'
        + '<polygon class="peak" points="560,418 578,444 542,444"/>'
        + '<polygon class="peak" points="520,538 538,564 502,564"/>'
        + '<text class="region-label" x="230" y="120" font-size="16">山 後 九 州</text>'

  }

    function render() {

          var stone = document.createElementNS(svgNS, "circle");
          stone.setAttribute("class", board[c.id] === "black" ? "stone-black" : "stone-white");

            mark.setAttribute("r", 3.6);

          var badge = document.createElementNS(svgNS, "g");
          badge.setAttribute("class", "lib-badge");

        var label = document.createElementNS(svgNS, "text");

        label.setAttribute("text-anchor", "middle");
        label.textContent = c.name;
        g.appendChild(label);

        nodesG.appendChild(g);
      });

  // ---------------------------------------------------------------------
  // Leaflet 渲染器（燕雲十六州實測地圖版）
  // ---------------------------------------------------------------------

  var LEAFLET_STYLE = {
    empty: { fillColor: "#d9cfb6", color: "#a4966f" },
    black: { fillColor: "#14110c", color: "#050403" },
    white: { fillColor: "#fdf8ec", color: "#2a2419" },
    hoverEmpty: { color: "#c24d34" },
    lastMoveBlack: "#d8c9a3",
    lastMoveWhite: "#2a2419"
  };

  function mountLeafletBoard(mountEl, scenario, engine, onNodeClick) {
    mountEl.innerHTML = "";
    var mapDiv = document.createElement("div");
    mapDiv.className = "board-map";
    mountEl.appendChild(mapDiv);

    var cityById = {};
    scenario.cities.forEach(function (c) { cityById[c.id] = c; });

    var bounds = L.latLngBounds(scenario.cities.map(function (c) { return [c.lat, c.lng]; }));
    var map = L.map(mapDiv, {
      center: bounds.getCenter(),
      zoom: 7,
      layers: [L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      })]
    });

    function fitToCities() {
      map.invalidateSize({ animate: false });
      map.fitBounds(bounds, { padding: [40, 40], animate: false });
    }
    fitToCities();
    requestAnimationFrame(fitToCities);
    setTimeout(fitToCities, 300);

    var edgeLayer = L.layerGroup().addTo(map);
    scenario.edges.forEach(function (e) {
      var a = cityById[e[0]], b = cityById[e[1]];
      L.polyline([[a.lat, a.lng], [b.lat, b.lng]], { color: "#a4966f", weight: 2, opacity: 0.85 }).addTo(edgeLayer);
    });

    var markers = {};
    var lastMoveDot = null;
    scenario.cities.forEach(function (c) {
      var marker = L.circleMarker([c.lat, c.lng], {
        radius: c.hub ? 12 : 10,
        weight: c.hub ? 3 : 1.6,
        fillColor: LEAFLET_STYLE.empty.fillColor,
        color: LEAFLET_STYLE.empty.color,
        fillOpacity: 1
      }).addTo(map);
      marker.bindTooltip(c.name, { permanent: true, direction: "top", offset: [0, -8], className: "city-tip" });
      marker.on("click", function () { onNodeClick(c.id); });
      marker.on("mouseover", function () {
        if (engine.getBoard()[c.id] === null) marker.setStyle({ color: LEAFLET_STYLE.hoverEmpty.color });
      });
      marker.on("mouseout", function () {
        if (engine.getBoard()[c.id] === null) marker.setStyle({ color: LEAFLET_STYLE.empty.color });
      });
      markers[c.id] = marker;
    });

    function render() {
      var board = engine.getBoard();
      var lastMove = engine.getLastMove();
      var libCache = {};
      engine.order.forEach(function (id) {
        if (board[id] !== null && libCache[id] === undefined) {
          var g = engine.getGroup(board, id);
          g.stones.forEach(function (s) { libCache[s] = g.liberties.size; });
        }
      });

      engine.order.forEach(function (id) {
        var c = cityById[id];
        var marker = markers[id];
        var occupied = board[id] !== null;
        if (!occupied) {
          marker.setStyle({ radius: c.hub ? 12 : 10, fillColor: LEAFLET_STYLE.empty.fillColor, color: LEAFLET_STYLE.empty.color, weight: c.hub ? 3 : 1.6 });
          marker.setTooltipContent(c.name);
        } else {
          var s = board[id] === "black" ? LEAFLET_STYLE.black : LEAFLET_STYLE.white;
          marker.setStyle({ radius: c.hub ? 13 : 11, fillColor: s.fillColor, color: s.color, weight: c.hub ? 2.6 : 1.5 });
          marker.setTooltipContent(c.name + "（氣：" + libCache[id] + "）");
        }
      });

      if (lastMoveDot) { map.removeLayer(lastMoveDot); lastMoveDot = null; }
      if (lastMove) {
        var lc = cityById[lastMove.id];
        lastMoveDot = L.circleMarker([lc.lat, lc.lng], {
          radius: 3, weight: 0, fillOpacity: 1,
          fillColor: lastMove.color === "black" ? LEAFLET_STYLE.lastMoveBlack : LEAFLET_STYLE.lastMoveWhite,
          interactive: false
        }).addTo(map);
      }
    }

    return {
      render: render,
      destroy: function () {
        map.remove();
        mountEl.innerHTML = "";
      }
    };
  }

  var currentEngine = null;
  var currentRenderer = null;
  var currentKey = null;

  function factionLabel(scenario, color) {
    var name = color === "black" ? scenario.factionBlack : scenario.factionWhite;
    return name + (color === "black" ? "（黑）" : "（白）");
  }

  function log(text, kind) {
    var ul = document.getElementById("log");
    var li = document.createElement("li");
    li.textContent = text;
    if (kind === "capture") li.className = "event-capture";
    if (kind === "illegal") li.className = "event-illegal";
    ul.insertBefore(li, ul.firstChild);
    while (ul.children.length > 60) ul.removeChild(ul.lastChild);
  }

  function onNodeClick(id) {
    var scenario = SCENARIOS[currentKey];
    var cityName = currentEngine.cityById[id].name;
    var result = currentEngine.attemptMove(id);

    if (result.status === "occupied") {
      log("此城市已被佔領，無法落子。", "illegal");
      return;
    }
    if (result.status === "suicide") {
      log("禁入（自殺手）：落在「" + cityName + "」會讓己方連塊立即無氣，且未能提對方子。", "illegal");
      return;
    }
    if (result.status === "ko") {
      log("打劫：此手會立即重現前一回合之前的同型盤面，禁止落子於「" + cityName + "」。", "illegal");
      return;
    }
    if (result.capturedIds.length) {
      var oppColor = result.color === "black" ? "white" : "black";
      log(factionLabel(scenario, result.color) + "於「" + cityName + "」落子，提" + factionLabel(scenario, oppColor) + result.capturedIds.length + "子："
        + result.capturedIds.map(function (cid) { return currentEngine.cityById[cid].name; }).join("、") + "。", "capture");
    } else {
      log(factionLabel(scenario, result.color) + "於「" + cityName + "」落子。氣：" + result.liberties + "。", "");
    }
    refreshAll();
  }

  function refreshAll() {
    currentRenderer.render();
    updateHud();
  }

  function updateHud() {
    var scenario = SCENARIOS[currentKey];
    var turn = currentEngine.getTurn();
    var captures = currentEngine.getCaptures();
    document.getElementById("turnDot").className = "dot " + turn;
    document.getElementById("turnText").textContent = factionLabel(scenario, turn);
    document.getElementById("capBlackLabel").textContent = "黑（" + scenario.factionBlack + "）提子";
    document.getElementById("capWhiteLabel").textContent = "白（" + scenario.factionWhite + "）提子";
    document.getElementById("capBlack").textContent = captures.black;
    document.getElementById("capWhite").textContent = captures.white;
  }

  function updateHeader(scenario) {
    document.getElementById("scenarioTitle").textContent = scenario.title;
    document.getElementById("scenarioDesc").textContent = scenario.desc;
  }

  function updateLegend(scenario) {
    var hubNames = scenario.cities.filter(function (c) { return c.hub; }).map(function (c) { return c.name; }).join("・");
    document.getElementById("legendBlackLabel").textContent = "黑棋（" + scenario.factionBlack + "）";
    document.getElementById("legendWhiteLabel").textContent = "白棋（" + scenario.factionWhite + "）";
    document.getElementById("legendHubLabel").textContent = hubNames ? ("樞紐城市（" + hubNames + "）") : "樞紐城市";
    document.getElementById("legendLastItem").textContent = scenario.type === "svg" ? "右上角數字＝該連塊的氣數" : "滑鼠移到城市節點可見氣數";
  }

  function showScore() {
    var scenario = SCENARIOS[currentKey];
    var territory = currentEngine.computeTerritory();
    var captures = currentEngine.getCaptures();
    var totalBlack = territory.black + captures.black;
    var totalWhite = territory.white + captures.white;
    document.getElementById("rowBlackLabel").textContent = "黑（" + scenario.factionBlack + "）";
    document.getElementById("rowWhiteLabel").textContent = "白（" + scenario.factionWhite + "）";
    document.getElementById("territoryBlack").textContent = territory.black;
    document.getElementById("territoryWhite").textContent = territory.white;
    document.getElementById("tallyCapBlack").textContent = captures.black;
    document.getElementById("tallyCapWhite").textContent = captures.white;
    document.getElementById("totalBlack").textContent = totalBlack;
    document.getElementById("totalWhite").textContent = totalWhite;
    var verdict = document.getElementById("verdictText");
    if (totalBlack === totalWhite) {
      verdict.textContent = "平局";
    } else {
      verdict.textContent = (totalBlack > totalWhite ? factionLabel(scenario, "black") : factionLabel(scenario, "white")) + "領先 " + Math.abs(totalBlack - totalWhite) + " 目";
    }
    document.getElementById("scoreOverlay").hidden = false;
  }

  function loadScenario(key) {
    var scenario = SCENARIOS[key];
    if (!scenario) return;
    currentKey = key;
    if (currentRenderer) currentRenderer.destroy();

    currentEngine = createEngine(scenario.cities, scenario.edges);
    updateHeader(scenario);
    updateLegend(scenario);

    var mount = document.getElementById("boardMount");
    currentRenderer = scenario.type === "svg"
      ? mountSvgBoard(mount, scenario, currentEngine, onNodeClick)
      : mountLeafletBoard(mount, scenario, currentEngine, onNodeClick);

    document.getElementById("log").innerHTML = "";
    log(factionLabel(scenario, "black") + "先行。" + scenario.title + "已就位。", "");
    document.getElementById("scenarioSelect").value = key;
    refreshAll();
  }

  document.getElementById("btnScore").addEventListener("click", showScore);
  document.getElementById("btnCloseScore").addEventListener("click", function () {
    document.getElementById("scoreOverlay").hidden = true;
  });
  document.getElementById("btnReset").addEventListener("click", function () { loadScenario(currentKey); });
  document.getElementById("scenarioSelect").addEventListener("change", function () { loadScenario(this.value); });

  loadScenario("yanyun_real");
})();
</script>
</body>
</html>
